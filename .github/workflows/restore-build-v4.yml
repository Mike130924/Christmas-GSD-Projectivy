name: Build Christmas GSD Projectivy APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-build-v4.yml"
      - "buildSrc/src/main/java/Versions.kt"
      - "build.gradle"
      - "app/**"
      - "library/**"
      - "buildSrc/**"
      - "gradle/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platform 36
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Christmas-GSD-Projectivy-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

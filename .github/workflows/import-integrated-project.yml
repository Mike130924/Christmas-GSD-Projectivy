name: Import integrated Christmas GSD project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-integrated-project:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract integrated Android project
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="Christmas_GSD_Projectivy_Integrated_Source.zip"

          if [[ ! -f "$ARCHIVE" ]]; then
            echo "::error::Could not find $ARCHIVE in the repository root."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/integrated-project"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/integrated-project"

          PROJECT_ROOT="$(find "$RUNNER_TEMP/integrated-project" -type f -name gradlew -print -quit | xargs -r dirname)"

          if [[ -z "$PROJECT_ROOT" ]]; then
            echo "::error::No gradlew file was found in the integrated ZIP."
            exit 1
          fi

          # Copy the integrated project into the repository root.
          # Existing GitHub Actions workflows are preserved.
          cp -a "$PROJECT_ROOT"/. .

          chmod +x ./gradlew

          # Do not replace the repository's existing workflows with
          # the template workflow bundled inside the source archive.
          rm -f .github/workflows/build.yml

          rm -f "$ARCHIVE"

      - name: Commit integrated project
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Integrate Christmas icon artwork into Android project"
            git push
          fi

name: Restore Gradle configuration and build APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-build.yml"

permissions:
  contents: write

jobs:
  restore-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore root Gradle build file
        shell: bash
        run: |
          set -euo pipefail
          cat > build.gradle <<'GRADLE'
          // Top-level build file.
          apply plugin: 'io.github.gradle-nexus.publish-plugin'

          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
                  maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
                  maven { url 'https://plugins.gradle.org/m2/' }
              }

              dependencies {
                  classpath Plugins.android
                  classpath Plugins.kotlin
                  classpath Plugins.sonatype
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
                  maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
                  maven { url 'https://plugins.gradle.org/m2/' }
              }
          }

          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          GRADLE

          chmod +x ./gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.gradle
          if ! git diff --cached --quiet; then
            git commit -m "Restore root Gradle build configuration"
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Christmas-GSD-Projectivy-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
